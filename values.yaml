image:
  # Empty = use Chart.yaml's appVersion (the source of truth). Override per
  # release (e.g. staged rollout of a new app version to one tenant).
  tag: ""

# ---------------------------------------------------------------------------
# Hive-level config.
# ---------------------------------------------------------------------------
hive:
  id: ""       # short tenant id (no beabee- prefix); webhook host is <id>.clients.hive.beabee.io
  domain: ""   # authoritative tenant domain
  insecure: false   # true = derive http:// (not https://) public URLs — local testing only

# Override individual env vars to pull from a different secret.
# Useful when splitting tenant vs shared secrets later.
# Key = env var name, value = secret name to read it from.
# These render as explicit env[].valueFrom.secretKeyRef and override envFrom.
secretRefs: {}
#  BEABEE_STRIPE_SECRETKEY:
#    name: org-shared-secrets
#  BEABEE_STRIPE_PUBLICKEY:
#    name: org-shared-secrets
#  BEABEE_DATABASE_URL:
#    name: my-tenant-db-secret
#    key: DATABASE_URL          # optional: defaults to the env var name

# ---------------------------------------------------------------------------
# Ingress (cluster ingress-nginx -> per-tenant router). TLS via cert-manager
# HTTP-01. Disabled by default; tenants opt in and supply their host(s).
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  # Use letsencrypt-staging while validating, then switch to letsencrypt-prod.
  clusterIssuer: letsencrypt-staging
  # TLS secret name; defaults to "<release>-tls" when left blank.
  tlsSecret: ""
  # Extra ingress annotations (merged with the cert-manager one).
  annotations: {}

# ---------------------------------------------------------------------------
# Component settings
#
# Resource defaults are the LOW-usage bracket, sized from 7 days of production
# metrics across 18 migrated tenants (2026-08-25): memory requests ~1.3-1.5x
# median steady state, memory limits ~1.5x the fleet-wide observed peak. CPU
# requests reflect actual usage (a whole tenant averages ~20m); the cpu limit
# stays high because CPU is compressible and throttling helps nobody.
#
# Higher-usage tenants override apiApp.resources in their HelmRelease values
# (deep-merged over these defaults) rather than raising the fleet default:
#   mid  (observed api peak ~250Mi):  requests 192Mi, limit 384Mi
#   high (api memory leak, see below): requests 256Mi, limit 768Mi
#
# NB: since v0.51.2 the backend images preload jemalloc (fixes the api-app
# native-memory leak). jemalloc runs a HIGHER steady-state RSS than glibc
# (~+50-70Mi per backend container, observed fleet-wide at rollout) in
# exchange for bounded growth -- the api/webhook limits below are sized for
# jemalloc-era baselines, not the original glibc-era measurements.
# ---------------------------------------------------------------------------
apiApp:
  enabled: true
  replicaCount: 1
  # glibc-era steady state 92Mi median / peak 177Mi max; jemalloc lifts the
  # fleet to 151Mi median / 211Mi max (first-hour, 2026-08-26).
  resources:
    requests:
      cpu: "25m"
      memory: "128Mi"
    limits:
      cpu: "2"
      memory: "320Mi"

webhookApp:
  enabled: true
  replicaCount: 1
  # glibc-era steady state 64Mi median / peak 141Mi max; jemalloc lifts the
  # fleet to 126Mi median / 164Mi max (first-hour, 2026-08-26).
  resources:
    requests:
      cpu: "10m"
      memory: "96Mi"
    limits:
      cpu: "2"
      memory: "256Mi"

legacyApp:
  enabled: true
  replicaCount: 1
  # Fleet steady state 84Mi median; peak 171Mi median / 234Mi max.
  resources:
    requests:
      cpu: "25m"
      memory: "128Mi"
    limits:
      cpu: "2"
      memory: "320Mi"

# Idle daemon is ~11Mi, but each triggered job spawns a full backend-cli boot
# (same code as the app tier) in this cgroup, and overlapping hourly jobs stack.
# Measured: idle ~20Mi, but job peaks reach 429Mi median / 481Mi max on EVERY
# tenant -- the old 512Mi limit left 6% headroom, and an OOMKill here aborts a
# job mid-run (unlike the stateless app tiers, where a restart is harmless).
# The limit is therefore the one value sized UP; the request stays low because
# the peaks are seconds-long and unsynchronized across tenants.
cronApp:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "25m"
      memory: "128Mi"
    limits:
      cpu: "2"
      memory: "640Mi"

frontend:
  enabled: true
  replicaCount: 1
  # Fleet steady state 6Mi median; peak 13Mi median / 20Mi max.
  resources:
    requests:
      cpu: "5m"
      memory: "16Mi"
    limits:
      cpu: "2"
      memory: "64Mi"

router:
  enabled: true
  replicaCount: 1
  # Fleet steady state 5Mi median; peak 8Mi median / 11Mi max.
  resources:
    requests:
      cpu: "5m"
      memory: "16Mi"
    limits:
      cpu: "2"
      memory: "64Mi"

# Run DB migrations (`typeorm migration:run`) as a pre-upgrade/pre-install
# hook Job before the deployments roll. A failed migration fails the upgrade
# and leaves the running pods untouched.
migration:
  enabled: true


cnpg:
  enabled: true
  namespace: hive-pg
  clusterName: hive-pg
  databaseName: ""  # defaults to .Release.Name
  owner: ""         # defaults to .Release.Name
  extensions:
    - uuid-ossp

# ---------------------------------------------------------------------------
# ZITADEL (shared IdP) — org lifecycle for this tenant. STRICTLY OPT-IN.
#
# When enabled, a post-install/upgrade hook ensures this tenant's
# organization, project and OIDC client in the shared ZITADEL instance and
# writes the resulting IDs to Secret "zitadel-<release>"; a labeled Ingress
# rendered into the zitadel namespace declares the tenant's vanity login
# domain (registered by the central domain reconciler there). Like the CNPG
# Database, the organization survives helm uninstall — offboarding is a
# manual runbook step.
#
# Enabling this provisions ONLY. The app keeps its built-in login until it
# consumes the provisioned values (separate app-side project).
# ---------------------------------------------------------------------------
zitadel:
  enabled: false
  # The namespace the shared ZITADEL runs in (target of the login-domain
  # Ingress, like cnpg.namespace for the Database).
  namespace: zitadel
  # In-cluster URL of the shared ZITADEL core (per-instance API calls go
  # here, selecting the instance via X-Forwarded-Host).
  internalApi: http://zitadel.zitadel.svc.cluster.local:8080
  # This tenant's virtual-instance name; defaults to the release name
  # (beabee-<id>), the same convention that names the database and the env
  # secret. Effectively immutable once provisioned: the central reconciler
  # finds the instance by exact name, so changing it later would CREATE A
  # SECOND INSTANCE, not rename.
  instanceName: ""
  # Vanity login domain for this tenant; defaults to auth.<hive.domain>.
  # Needs a DNS record pointing at the shared ingress LB.
  loginDomain: ""
  # cert-manager issuer for the login-domain certificate.
  clusterIssuer: letsencrypt-prod
  projectName: beabee
  # Name of this tenant's instance-admin PAT secret (keys pat / instanceId /
  # generatedDomain), created by the central reconciler and reflector-
  # mirrored into this namespace. Defaults to
  # zitadel-instance-pat-<instanceName>.
  patSecretName: ""
  # OAuth callback paths on the tenant's app domain (hive.domain), used for
  # the OIDC client's redirect URIs. The default matches the app's
  # BEABEE_OIDC_REDIRECTURI default (${BEABEE_AUDIENCE}/api/1.0/auth/callback).
  redirectPaths:
    - /api/1.0/auth/callback
  postLogoutPaths:
    - /
  # DEPRECATED (org-model leftovers, ignored; removed once all tenants are
  # on the instance model):
  host: ""
  orgName: ""
