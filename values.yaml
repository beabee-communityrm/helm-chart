image:
  tag: v0.33.8

# ---------------------------------------------------------------------------
# External secret (managed outside this chart, e.g. via SOPS)
# The chart never templates secret values — only references by name.
# Defaults to "env-{{ .Release.Name }}" (i.e. the env-beabee-portzero secret from env.sops.yaml).
# ---------------------------------------------------------------------------
secretName: ""

# Override individual env vars to pull from a different secret.
# Useful when splitting tenant vs shared secrets later.
# Key = env var name, value = secret name to read it from.
# These render as explicit env[].valueFrom.secretKeyRef and override envFrom.
secretRefs: {}
#  BEABEE_STRIPE_SECRETKEY:
#    name: org-shared-secrets
#  BEABEE_STRIPE_PUBLICKEY:
#    name: org-shared-secrets
#  BEABEE_DATABASE_URL:
#    name: my-tenant-db-secret
#    key: DATABASE_URL          # optional: defaults to the env var name

# ---------------------------------------------------------------------------
# Ingress (cluster ingress-nginx -> per-tenant router). TLS via cert-manager
# HTTP-01. Disabled by default; tenants opt in and supply their host(s).
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  # Use letsencrypt-staging while validating, then switch to letsencrypt-prod.
  clusterIssuer: letsencrypt-staging
  # Primary host — injected at release time from the tenant's sealed secret
  # (HelmRelease valuesFrom: BEABEE_DOMAIN -> ingress.host), so no hostname is
  # stored in plaintext in git.
  host: ""
  # Optional additional hosts (e.g. a customer's custom domain).
  extraHosts: []
  # TLS secret name; defaults to "<release>-tls" when left blank.
  tlsSecret: ""
  # Extra ingress annotations (merged with the cert-manager one).
  annotations: {}

# ---------------------------------------------------------------------------
# All tenant env — including non-secret vars like BEABEE_DOMAIN / COUNTRYCODE —
# lives in the tenant's single sealed secret (env-<release>, from env.sops.yaml)
# and reaches every component via envFrom / secretKeyRef. The chart no longer
# renders a ConfigMap: one source of truth per tenant.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
