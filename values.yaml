image:
  # Empty = use Chart.yaml's appVersion (the source of truth). Override per
  # release (e.g. staged rollout of a new app version to one tenant).
  tag: ""

# ---------------------------------------------------------------------------
# Hive-level config.
# ---------------------------------------------------------------------------
hive:
  id: ""       # short tenant id (no beabee- prefix); webhook host is <id>.clients.hive.beabee.io
  domain: ""   # authoritative tenant domain
  insecure: false   # true = derive http:// (not https://) public URLs — local testing only

# Override individual env vars to pull from a different secret.
# Useful when splitting tenant vs shared secrets later.
# Key = env var name, value = secret name to read it from.
# These render as explicit env[].valueFrom.secretKeyRef and override envFrom.
secretRefs: {}
#  BEABEE_STRIPE_SECRETKEY:
#    name: org-shared-secrets
#  BEABEE_STRIPE_PUBLICKEY:
#    name: org-shared-secrets
#  BEABEE_DATABASE_URL:
#    name: my-tenant-db-secret
#    key: DATABASE_URL          # optional: defaults to the env var name

# ---------------------------------------------------------------------------
# Ingress (cluster ingress-nginx -> per-tenant router). TLS via cert-manager
# HTTP-01. Disabled by default; tenants opt in and supply their host(s).
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  # Use letsencrypt-staging while validating, then switch to letsencrypt-prod.
  clusterIssuer: letsencrypt-staging
  # TLS secret name; defaults to "<release>-tls" when left blank.
  tlsSecret: ""
  # Extra ingress annotations (merged with the cert-manager one).
  annotations: {}

# ---------------------------------------------------------------------------
# Component settings
#
# Resource defaults measured 2026-08-28..09-07 across 45 tenants. The window
# starts after the v0.51.2 jemalloc step (2026-08-26), which raised
# steady-state RSS fleet-wide; earlier data biases requests low.
#
# Requests come from container_memory_rss at the p95 of per-pod medians: a
# request is a steady-state reservation, and staying under it keeps a pod off
# the kubelet's eviction shortlist. Limits come from
# container_memory_working_set_bytes at ~1.2-1.5x the fleet peak, because the
# cgroup v2 limit is enforced against memory.current, which includes page
# cache -- sizing a limit from RSS understates it. CPU is unchanged.
#
# Tenants whose api-app runs hotter than these defaults override
# apiApp.resources in their own HelmRelease values, deep-merged over this file.
# ---------------------------------------------------------------------------
apiApp:
  enabled: true
  replicaCount: 1
  # median RSS 155Mi, p95 of per-pod medians 195Mi, WS peak 309Mi, excluding
  # the tenants that override.
  resources:
    requests:
      cpu: "25m"
      memory: "192Mi"
    limits:
      cpu: "2"
      memory: "384Mi"

webhookApp:
  enabled: true
  replicaCount: 1
  # median RSS 130Mi, p95 142Mi, WS peak 260Mi. Request 160 -> 144Mi: 160Mi
  # was above every RSS sample in the window.
  resources:
    requests:
      cpu: "10m"
      memory: "144Mi"
    limits:
      cpu: "2"
      memory: "384Mi"

legacyApp:
  enabled: true
  replicaCount: 1
  # median RSS 170Mi, p95 182Mi, WS peak 317Mi. Limit 512 -> 448Mi (1.41x the
  # WS peak); 512Mi came from reading that 317Mi WS peak as if it were RSS.
  resources:
    requests:
      cpu: "25m"
      memory: "192Mi"
    limits:
      cpu: "2"
      memory: "448Mi"

# Bimodal: the daemon idles at 27Mi median RSS, but each triggered job boots a
# full backend-cli in this cgroup and peaks at 605Mi RSS / 632Mi WS.
#
# request 128 -> 80Mi (p95 of per-pod medians is 53Mi). Reserving the burst
# fleet-wide would hold 27GB for a total that peaks at 3275Mi, and the bursts
# are unsynchronized -- at most 6 of 45 pods above 200Mi at once over 10 days.
# limit 640 -> 768Mi, the one value sized up: WS peak 632Mi left 8Mi of
# headroom, and an OOMKill here aborts a job mid-run rather than restarting.
cronApp:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "25m"
      memory: "80Mi"
    limits:
      cpu: "2"
      memory: "768Mi"

frontend:
  enabled: true
  replicaCount: 1
  # median RSS 4Mi, RSS peak 7Mi, WS peak 35Mi -- nginx serves the built assets
  # from page cache. Unchanged; sizing this one from RSS is the trap.
  resources:
    requests:
      cpu: "5m"
      memory: "16Mi"
    limits:
      cpu: "2"
      memory: "64Mi"

router:
  enabled: true
  replicaCount: 1
  # median RSS 7Mi, RSS peak 11Mi, WS peak 17Mi. Unchanged.
  resources:
    requests:
      cpu: "5m"
      memory: "16Mi"
    limits:
      cpu: "2"
      memory: "64Mi"

# Run DB migrations (`typeorm migration:run`) as a pre-upgrade/pre-install
# hook Job before the deployments roll. A failed migration fails the upgrade
# and leaves the running pods untouched.
migration:
  enabled: true

# One-off `yarn backend-cli` runs: a suspended CronJob (never fires) that is
# the template one-off Jobs are stamped from with `kubectl create job --from`
# (see README for the exact invocation). backend-cli boots a full beabee
# application, so it cannot run inside api-app's memory limit; this gives it
# a pod of its own with the same image and env as the backends.
#
# Sizing: the cron-app's triggered jobs are the same backend-cli through the
# same yarn wrapper and peak at 605Mi RSS / 632Mi WS (see cronApp). Unlike a
# daemon, a one-off pod's request should cover its actual peak so the
# scheduler places it on a node with room; the limit leaves headroom for the
# heavier commands cron never runs (database export, migrate-uploads).
cli:
  enabled: true
  # How long finished Jobs (and their logs) stay before Kubernetes deletes
  # them. A day: long enough to read the output the next morning.
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "1Gi"


cnpg:
  enabled: true
  namespace: hive-pg
  clusterName: hive-pg
  databaseName: ""  # defaults to .Release.Name
  owner: ""         # defaults to .Release.Name
  extensions:
    - uuid-ossp

# Hive's invoicing reads every tenant database through one internal role, a
# CNPG managed role on the shared cluster. This post-install/upgrade hook
# gives that role what hive-deploy-stack's new-instance.sh used to set up by
# hand: an "invoices" schema holding payment_seen, and SELECT on the app's
# tables. It runs as the tenant role -- the database owner -- so no superuser
# is involved; the invoicing role only has to exist. Idempotent, and it
# leaves an invoices schema it does not own alone (migrated tenants brought
# theirs over owned by the invoicing role).
invoices:
  enabled: true
  role: beabee-invoices
  # Needs psql, which the app image lacks. The cluster's own Postgres image
  # is already on the nodes and matches the server's major version.
  image: ghcr.io/cloudnative-pg/postgresql:16.9-standard-bookworm
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

# ---------------------------------------------------------------------------
# ZITADEL (shared IdP) — this tenant's virtual instance. STRICTLY OPT-IN.
#
# When enabled, a labeled Ingress rendered into the zitadel namespace
# declares the tenant's virtual instance and vanity login domain (the
# central reconciler there creates the instance and delivers its admin PAT),
# and a post-install/upgrade hook ensures project and OIDC client inside the
# instance, plus a human "admin" user (IAM_OWNER), and writes the resulting
# IDs to Secret "zitadel-<release>" and the admin's credentials to
# "zitadel-<release>-admin". Like
# the CNPG Database, the instance survives helm uninstall — offboarding is a
# manual runbook step.
#
# Enabling this provisions ONLY. What the app does with the instance is a
# separate, per-tenant step: zitadel.state (see README).
# ---------------------------------------------------------------------------
zitadel:
  enabled: false
  # Which of the app's three instance states this tenant is in (monorepo
  # docs/oidc-login.md). Renders the matching BEABEE_IDP_* / BEABEE_LOGIN_*
  # env into every backend from the provisioned Secrets; move one step at a
  # time, one deploy each (the Secrets the env references must already
  # exist, so never enable and wire in the same deploy):
  #   standalone  provisioning only, password login (default)
  #   idp         BEABEE_IDP_PROVIDER=zitadel — accounts are provisioned/
  #               linked in the instance, login unchanged
  #   oidc        + BEABEE_LOGIN_PROVIDER=oidc — THE LOGIN FLIP
  # Break-glass: set back to idp and redeploy (password hashes are kept).
  state: standalone
  # The namespace the shared ZITADEL runs in (target of the login-domain
  # Ingress, like cnpg.namespace for the Database).
  namespace: zitadel
  # In-cluster URL of the shared ZITADEL core (per-instance API calls go
  # here, selecting the instance via X-Forwarded-Host).
  internalApi: http://zitadel.zitadel.svc.cluster.local:8080
  # This tenant's virtual-instance name; defaults to the release name
  # (beabee-<id>), the same convention that names the database and the env
  # secret. Effectively immutable once provisioned: the central reconciler
  # finds the instance by exact name, so changing it later would CREATE A
  # SECOND INSTANCE, not rename.
  instanceName: ""
  # Vanity login domain for this tenant; defaults to auth.<hive.domain>.
  # Needs a DNS record pointing at the shared ingress LB.
  loginDomain: ""
  # Email for the human admin user (ZITADEL requires one); defaults to
  # admin@<loginDomain>. It is created as verified, so no mail is ever sent.
  adminEmail: ""
  # cert-manager issuer for the login-domain certificate.
  clusterIssuer: letsencrypt-prod
  projectName: beabee
  # Name of this tenant's instance-admin PAT secret (keys pat / instanceId /
  # generatedDomain), created by the central reconciler and reflector-
  # mirrored into this namespace. Defaults to
  # zitadel-instance-pat-<instanceName>.
  patSecretName: ""
  # OAuth callback paths on the tenant's app domain (hive.domain), used for
  # the OIDC client's redirect URIs. The default matches the app's
  # BEABEE_LOGIN_SETTINGS_REDIRECTURI default
  # (${BEABEE_AUDIENCE}/api/1.0/auth/callback). The bootstrap Job keeps the
  # client's URI lists in sync with these on every run.
  redirectPaths:
    - /api/1.0/auth/callback
  # Post-logout redirect paths. ZITADEL matches post_logout_redirect_uri
  # exactly, and the app's default BEABEE_LOGIN_SETTINGS_POSTLOGOUTREDIRECTURI
  # is BEABEE_AUDIENCE with no trailing slash — so register both variants.
  postLogoutPaths:
    - ""
    - /
