image:
  # Empty = use Chart.yaml's appVersion (the source of truth). Override per
  # release (e.g. staged rollout of a new app version to one tenant).
  tag: ""

# ---------------------------------------------------------------------------
# Hive-level config.
# ---------------------------------------------------------------------------
hive:
  id: ""       # short tenant id (no beabee- prefix); webhook host is <id>.clients.hive.beabee.io
  domain: ""   # authoritative tenant domain
  insecure: false   # true = derive http:// (not https://) public URLs — local testing only

# Override individual env vars to pull from a different secret.
# Useful when splitting tenant vs shared secrets later.
# Key = env var name, value = secret name to read it from.
# These render as explicit env[].valueFrom.secretKeyRef and override envFrom.
secretRefs: {}
#  BEABEE_STRIPE_SECRETKEY:
#    name: org-shared-secrets
#  BEABEE_STRIPE_PUBLICKEY:
#    name: org-shared-secrets
#  BEABEE_DATABASE_URL:
#    name: my-tenant-db-secret
#    key: DATABASE_URL          # optional: defaults to the env var name

# ---------------------------------------------------------------------------
# Ingress (cluster ingress-nginx -> per-tenant router). TLS via cert-manager
# HTTP-01. Disabled by default; tenants opt in and supply their host(s).
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  # Use letsencrypt-staging while validating, then switch to letsencrypt-prod.
  clusterIssuer: letsencrypt-staging
  # TLS secret name; defaults to "<release>-tls" when left blank.
  tlsSecret: ""
  # Extra ingress annotations (merged with the cert-manager one).
  annotations: {}

# ---------------------------------------------------------------------------
# Component settings
# ---------------------------------------------------------------------------
apiApp:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "192Mi"
    limits:
      cpu: "2"
      memory: "768Mi"

webhookApp:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "2"
      memory: "256Mi"

legacyApp:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "160Mi"
    limits:
      cpu: "2"
      memory: "512Mi"

# Idle daemon is ~11Mi, but each triggered job spawns a full backend-cli boot
# (same code as the app tier) in this cgroup, and overlapping hourly jobs stack.
# Sized like the app tier; refine from measured memory.peak.
cronApp:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "2"
      memory: "512Mi"

frontend:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "2"
      memory: "128Mi"

router:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "2"
      memory: "128Mi"

migration:
  enabled: false


cnpg:
  enabled: true
  namespace: hive-pg
  clusterName: hive-pg
  databaseName: ""  # defaults to .Release.Name
  owner: ""         # defaults to .Release.Name
  extensions:
    - uuid-ossp

# ---------------------------------------------------------------------------
# ZITADEL (shared IdP) — org lifecycle for this tenant. STRICTLY OPT-IN.
#
# When enabled, a post-install/upgrade hook ensures this tenant's
# organization, project and OIDC client in the shared ZITADEL instance and
# writes the resulting IDs to Secret "zitadel-<release>"; a labeled Ingress
# rendered into the zitadel namespace declares the tenant's vanity login
# domain (registered by the central domain reconciler there). Like the CNPG
# Database, the organization survives helm uninstall — offboarding is a
# manual runbook step.
#
# Enabling this provisions ONLY. The app keeps its built-in login until it
# consumes the provisioned values (separate app-side project).
# ---------------------------------------------------------------------------
zitadel:
  enabled: false
  # Public host of the shared ZITADEL instance, e.g. auth.hive.beabee.io.
  # Required when enabled.
  host: ""
  # The namespace the shared ZITADEL runs in (target of the login-domain
  # Ingress, like cnpg.namespace for the Database).
  namespace: zitadel
  # Vanity login domain for this tenant; defaults to auth.<hive.domain>.
  # Needs a DNS record pointing at the shared ingress LB.
  loginDomain: ""
  # cert-manager issuer for the login-domain certificate.
  clusterIssuer: letsencrypt-prod
  # ZITADEL organization name; defaults to the release name (beabee-<id>),
  # the same convention that names the database and the env secret.
  # Effectively immutable once provisioned: the bootstrap finds the org by
  # exact name, so changing it later would CREATE A SECOND ORG, not rename.
  orgName: ""
  projectName: beabee
  # Name of the admin PAT secret (key "pat"), reflector-mirrored into this
  # namespace from the zitadel namespace.
  patSecretName: iam-admin-pat
  # OAuth callback paths on the tenant's app domain (hive.domain), used for
  # the OIDC client's redirect URIs. The default matches the app's
  # BEABEE_OIDC_REDIRECTURI default (${BEABEE_AUDIENCE}/api/1.0/auth/callback).
  redirectPaths:
    - /api/1.0/auth/callback
  postLogoutPaths:
    - /
