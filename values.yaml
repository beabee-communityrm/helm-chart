image:
  tag: v0.33.8

# ---------------------------------------------------------------------------
# External secret (managed outside this chart, e.g. via SOPS)
# The chart never templates secret values — only references by name.
# Defaults to "env-{{ .Release.Name }}" (i.e. the env-beabee-portzero secret from env.sops.yaml).
# ---------------------------------------------------------------------------
secretName: ""

# Override individual env vars to pull from a different secret.
# Useful when splitting tenant vs shared secrets later.
# Key = env var name, value = secret name to read it from.
# These render as explicit env[].valueFrom.secretKeyRef and override envFrom.
secretRefs: {}
#  BEABEE_STRIPE_SECRETKEY:
#    name: org-shared-secrets
#  BEABEE_STRIPE_PUBLICKEY:
#    name: org-shared-secrets
#  BEABEE_DATABASE_URL:
#    name: my-tenant-db-secret
#    key: DATABASE_URL          # optional: defaults to the env var name

# ---------------------------------------------------------------------------
# Per-tenant config (rendered as a ConfigMap by this chart)
# ---------------------------------------------------------------------------
config:
  BEABEE_AUDIENCE: "https://example.com"
  BEABEE_COOKIE_DOMAIN: "example.com"
  BEABEE_COOKIE_SECURE: "true"
  BEABEE_DEV: "false"
  BEABEE_DOMAIN: "example.com"
  BEABEE_ENVIRONMENT: "production"
  BEABEE_TRUSTEDORIGINS: "https://example.com"
  BEABEE_EXPERIMENTAL_FEATURES: ""
  BEABEE_CNR_MODE: ""
  BEABEE_COUNTRYCODE: "de"
  BEABEE_CURRENCYCODE: "EUR"
  BEABEE_CURRENCYSYMBOL: "€"
  BEABEE_EMAIL_PROVIDER: "smtp"
  BEABEE_NEWSLETTER_PROVIDER: "none"
  BEABEE_GOCARDLESS_SANDBOX: "true"
  BEABEE_STRIPE_COUNTRY: "eu"
  BEABEE_MINIO_ENDPOINT: "http://minio:9000"
  BEABEE_MINIO_BUCKET: "uploads"

# ---------------------------------------------------------------------------
# Component settings
# ---------------------------------------------------------------------------
apiApp:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "164Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

webhookApp:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "164Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

legacyApp:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "164Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

cronApp:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

frontend:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

router:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

redis:
  enabled: false
  image: redis:8.2-alpine
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

migration:
  enabled: false


cnpg:
  enabled: true
  namespace: pg-beabee
  clusterName: pg-beabee
  databaseName: ""  # defaults to .Release.Name
  owner: ""         # defaults to .Release.Name
