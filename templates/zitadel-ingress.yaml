{{- if .Values.zitadel.enabled }}
# The tenant's vanity login domain, declared as an Ingress in the ZITADEL
# namespace. The label is picked up by the central domain reconciler there, which registers
# the host inside ZITADEL (instance + trusted domain). Routing and the
# certificate are handled here; the hostname needs a DNS record pointing at
# the shared ingress LB. Deleted with the release on purpose — the
# ZITADEL-side domain registrations are removed manually (runbook).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zitadel-login-{{ include "beabee.fullname" . }}
  namespace: {{ .Values.zitadel.namespace }}
  labels:
    {{- include "beabee.labels" . | nindent 4 }}
    component: zitadel-login-domain
    beabee.io/zitadel-login-domain: "true"
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.zitadel.clusterIssuer }}
    # ZITADEL does no rate limiting of its own and password hashing is
    # CPU-bound on the shared core: per-client-IP limits at the proxy slow
    # credential stuffing without touching a normal login (a page load is
    # well under the burst of 100). Rejections answer 503.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # The central reconciler reads these: which virtual instance to ensure
    # and where to deliver its admin-PAT Secret (via the reflector).
    beabee.io/zitadel-instance: {{ include "beabee.zitadelInstanceName" . | quote }}
    beabee.io/pat-namespace: {{ .Release.Namespace | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - host: {{ include "beabee.zitadelLoginDomain" . | quote }}
      http:
        # Only what browsers and OIDC clients need. The management APIs,
        # the Console and the core's debug endpoints stay off the public
        # host: the app reaches the API in-cluster (zitadel.internalApi),
        # and every other path redirects to the app (next Ingress).
        # Service names/ports are those of the shared ZITADEL namespace.
        paths:
          # discovery, authorize, token, keys, introspection
          - path: /oauth/v2
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
          # userinfo, end_session
          - path: /oidc/v1
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
          # branding assets (logo, icon, font) the login pages load
          - path: /assets/v1
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
          # the hosted login UI, behind the proxy that injects beabee's
          # stylesheet (monorepo ADR-0006)
          - path: /ui/v2/login
            pathType: Prefix
            backend:
              service:
                name: zitadel-login-theme
                port:
                  number: 80
  tls:
    - hosts:
        - {{ include "beabee.zitadelLoginDomain" . | quote }}
      secretName: zitadel-login-{{ include "beabee.fullname" . }}-tls
---
# Every other path on the login domain redirects to the app, among them the
# root and the Console, where ZITADEL would otherwise send a browser that
# arrives without an app context. A separate Ingress because the redirect
# annotation applies to all of an Ingress's paths. Without the
# zitadel-login-domain label, so the reconciler does not read it as a
# declaration; TLS comes from the Ingress above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zitadel-login-{{ include "beabee.fullname" . }}-redirect
  namespace: {{ .Values.zitadel.namespace }}
  labels:
    {{- include "beabee.labels" . | nindent 4 }}
    component: zitadel-login-redirect
  annotations:
    nginx.ingress.kubernetes.io/temporal-redirect: {{ printf "%s://%s/" (include "beabee.scheme" .) .Values.hive.domain | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    - host: {{ include "beabee.zitadelLoginDomain" . | quote }}
      http:
        paths:
          # The backend is required but never reached: nginx answers the
          # redirect itself.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
{{- end }}
