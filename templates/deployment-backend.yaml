{{/*
Backend apps. All share one Deployment shape and each entry only names what
differs: values key, component/image name, and ports. Each app serves 3000
(router-facing app traffic) and 4000 (service-to-service messaging); cron serves
neither — nothing routes to it. Per-service values keys (apiApp, …) are unchanged.
*/}}
{{- $backends := list
    (dict "key" "apiApp"     "name" "api-app"     "ports" (list 3000 4000))
    (dict "key" "webhookApp" "name" "webhook-app" "ports" (list 3000 4000))
    (dict "key" "legacyApp"  "name" "legacy-app"  "ports" (list 3000 4000))
    (dict "key" "cronApp"    "name" "cron-app") -}}
{{- range $b := $backends }}
{{- $cfg := index $.Values $b.key }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beabee.fullname" $ }}-{{ $b.name }}
  labels:
    {{- include "beabee.labels" $ | nindent 4 }}
    component: {{ $b.name }}
spec:
  replicas: {{ $cfg.replicaCount }}
  selector:
    matchLabels:
      {{- include "beabee.selectorLabels" (dict "component" $b.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beabee.selectorLabels" (dict "component" $b.name) | nindent 8 }}
    spec:
      containers:
        - name: {{ $b.name }}
          image: beabee/beabee-{{ $b.name }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}
          envFrom:
            - secretRef:
                name: {{ include "beabee.secretName" $ }}
          env:
            {{- include "beabee.hiveDerivedEnv" $ | nindent 12 }}
            {{- /* HIVE_ vars are normally infra-only, but the backend NetworkCommunicator
                   needs HIVE_SERVICE_* for now — an accepted anti-pattern (monorepo#630). */}}
            {{- include "beabee.hiveServiceEnv" $ | nindent 12 }}
            {{- with (include "beabee.secretRefEnv" $) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- with $b.ports }}
          ports:
            {{- range . }}
            - containerPort: {{ . }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
{{- end }}
{{- end }}
