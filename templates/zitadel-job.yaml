{{- if .Values.zitadel.enabled }}
{{- $scheme := include "beabee.scheme" . -}}
{{- $redirects := list -}}
{{- range .Values.zitadel.redirectPaths -}}
{{- $redirects = append $redirects (printf "%s://%s%s" $scheme $.Values.hive.domain .) -}}
{{- end -}}
{{- $postLogouts := list -}}
{{- range .Values.zitadel.postLogoutPaths -}}
{{- $postLogouts = append $postLogouts (printf "%s://%s%s" $scheme $.Values.hive.domain .) -}}
{{- end -}}
# Provisions the inside of this tenant's ZITADEL virtual instance after
# every install/upgrade (idempotent — see the script in
# zitadel-configmap.yaml). The instance itself is created by the central
# reconciler from the login-domain Ingress's annotations; this job waits
# for the instance-admin PAT Secret the reconciler delivers (a missing
# secretKeyRef keeps the pod pending until the Secret arrives — the wait
# is free), bounded by activeDeadlineSeconds (~3 reconciler ticks).
# A post- hook on purpose: while the app doesn't consume OIDC, a ZITADEL
# outage must never block a normal app deploy; the migration job stays the
# only pre- hook.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "beabee.fullname" . }}-zitadel-bootstrap
  labels:
    {{- include "beabee.labels" . | nindent 4 }}
    component: zitadel-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "beabee.selectorLabels" (dict "component" "zitadel-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "beabee.fullname" . }}-zitadel-bootstrap
      containers:
        - name: bootstrap
          # The app image doubles as our Node runtime — already trusted and
          # pulled in this namespace; the script only needs node >= 24.
          image: beabee/beabee-api-app:{{ .Values.image.tag | default .Chart.AppVersion }}
          command: ['node', '/scripts/bootstrap.mjs']
          env:
            - name: ZITADEL_API
              value: {{ .Values.zitadel.internalApi | quote }}
            # All three from the reconciler-delivered instance Secret; the
            # pod stays pending until it exists (first-install wait).
            - name: ZITADEL_PAT
              valueFrom:
                secretKeyRef:
                  name: {{ include "beabee.zitadelPatSecretName" . }}
                  key: pat
            - name: INSTANCE_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "beabee.zitadelPatSecretName" . }}
                  key: generatedDomain
            - name: INSTANCE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "beabee.zitadelPatSecretName" . }}
                  key: instanceId
            - name: ISSUER
              value: {{ include "beabee.zitadelIssuer" . | quote }}
            - name: PROJECT_NAME
              value: {{ .Values.zitadel.projectName | quote }}
            - name: REDIRECT_URIS
              value: {{ join "," $redirects | quote }}
            - name: POST_LOGOUT_URIS
              value: {{ join "," $postLogouts | quote }}
            - name: TARGET_SECRET
              value: {{ include "beabee.zitadelSecretName" . }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: {{ include "beabee.fullname" . }}-zitadel-bootstrap
{{- end }}
