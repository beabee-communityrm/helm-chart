{{- if .Values.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ default .Release.Name .Values.cnpg.databaseName }}
  namespace: {{ .Values.cnpg.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  name: {{ default .Release.Name .Values.cnpg.databaseName }}
  owner: {{ default .Release.Name .Values.cnpg.owner }}
  cluster:
    name: {{ .Values.cnpg.clusterName }}
{{- with .Values.cnpg.extensions }}
  extensions:
    {{- range . }}
    - name: {{ . }}
      ensure: present
    {{- end }}
{{- end }}
{{- end }}
