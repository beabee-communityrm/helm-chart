{{- if .Values.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ default .Release.Name .Values.cnpg.databaseName }}
  namespace: {{ .Values.cnpg.namespace }}
spec:
  name: {{ default .Release.Name .Values.cnpg.databaseName }}
  owner: {{ default .Release.Name .Values.cnpg.owner }}
  cluster:
    name: {{ .Values.cnpg.clusterName }}
{{- end }}
