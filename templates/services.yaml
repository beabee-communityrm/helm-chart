{{/*
App backend Services — api/legacy/webhook share one shape: 3000 (router-facing
app traffic) and 4000 (service-to-service). Mirrors deployment-backend.yaml.
*/}}
{{- $appServices := list
    (dict "key" "apiApp"     "name" "api-app")
    (dict "key" "legacyApp"  "name" "legacy-app")
    (dict "key" "webhookApp" "name" "webhook-app") -}}
{{- range $s := $appServices }}
{{- if (index $.Values $s.key).enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "beabee.fullname" $ }}-{{ $s.name }}
  labels:
    {{- include "beabee.labels" $ | nindent 4 }}
    component: {{ $s.name }}
spec:
  selector:
    {{- include "beabee.selectorLabels" (dict "component" $s.name) | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: messaging
      port: 4000
      targetPort: 4000
      protocol: TCP
{{- end }}
{{- end }}
{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "beabee.fullname" . }}-frontend
  labels:
    {{- include "beabee.labels" . | nindent 4 }}
    component: frontend
spec:
  selector:
    {{- include "beabee.selectorLabels" (dict "component" "frontend") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
{{- end }}
{{- if .Values.router.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "beabee.fullname" . }}-router
  labels:
    {{- include "beabee.labels" . | nindent 4 }}
    component: router
spec:
  selector:
    {{- include "beabee.selectorLabels" (dict "component" "router") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
{{- end }}
