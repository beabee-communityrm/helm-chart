{{- if .Values.router.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beabee.fullname" . }}-router
  labels:
    {{- include "beabee.labels" . | nindent 4 }}
    component: router
spec:
  replicas: {{ .Values.router.replicaCount }}
  selector:
    matchLabels:
      {{- include "beabee.selectorLabels" (dict "component" "router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beabee.selectorLabels" (dict "component" "router") | nindent 8 }}
    spec:
      containers:
        - name: router
          image: beabee/beabee-router:{{ .Values.image.tag | default .Chart.AppVersion }}
          env:
            # Domain-derived (from hive.domain), see _helpers.tpl
            - name: LEGACY_APP_COOKIE_DOMAIN
              value: "{{ .Values.hive.domain }}"
            # Per-tenant config — from the single tenant secret
            # The router requires TRUSTED_ORIGINS to be set, but the tenant
            # secret may not contain it. Declaring the var twice defaults it
            # to "" — the later secretKeyRef overrides when the key exists,
            # and is skipped (keeping the default) when it doesn't.
            - name: TRUSTED_ORIGINS
              value: ""
            - name: TRUSTED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: {{ include "beabee.secretName" . }}
                  key: BEABEE_TRUSTEDORIGINS
                  optional: true
            # Upstream service DNS (router routes to these), see _helpers.tpl
            {{- include "beabee.hiveServiceEnv" . | nindent 12 }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
{{- end }}
